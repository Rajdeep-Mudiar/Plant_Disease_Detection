name: Deploy AgroPath to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/package.json

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Build frontend production bundle
        working-directory: ./Frontend
        run: npm run build

      - name: Create 404 fallback for SPA routing
        run: cp ./Frontend/dist/index.html ./Frontend/dist/404.html

      # Deploy to gh-pages branch (works out-of-the-box regardless of source mode)
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./Frontend/dist
          branch: gh-pages
          clean: true
